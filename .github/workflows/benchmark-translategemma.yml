name: Benchmark TranslateGemma

on:
  push:
    branches: [localize-a2-production]
    paths:
      - .github/workflows/benchmark-translategemma.yml
      - tools/benchmark_translategemma.py

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install llama.cpp Python wheel
        run: |
          python -m pip install -q --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python huggingface-hub
      - name: Run benchmark
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python tools/benchmark_translategemma.py

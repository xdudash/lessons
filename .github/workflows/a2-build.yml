name: Fix L23 naturalness

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fix L23 vocabulary example at source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/a2_build/generator.py')
          s=p.read_text(encoding='utf-8')
          old="'zajtra namiesto':('Prídem zajtra namiesto dnes.','Я прийду завтра замість сьогодні.')"
          new="'zajtra namiesto':('Prídem zajtra, nie dnes.','Я прийду завтра, не сьогодні.')"
          if s.count(old)!=1:
              raise SystemExit(f'expected one L23 anchor, got {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Run full A2 build test suite
        run: python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Commit green L23 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/a2_build/generator.py
          git commit -m '[skip ci] fix: naturalize A2 L23 replacement example'
          git push origin HEAD:a2-generator-debug

name: Fix and test A2 generator quality

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch example classification at the root cause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/a2_build/generator.py')
          text=p.read_text(encoding='utf-8')
          start=text.index("    if low in special: return special[low]\n")
          end=text.index("\n\ndef tok", start)
          replacement=base64.b64decode("").decode('utf-8')
          p.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY
      - name: Run regression suite
        run: python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Commit green generator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/a2_build/generator.py
          git commit -m '[skip ci] fix: generate grammatically safe A2 examples'
          git push origin HEAD:a2-generator-debug

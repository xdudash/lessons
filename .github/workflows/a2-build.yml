name: Test L23 naturalness

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run L23 naturalness regression
        run: python3 -m unittest tools.a2_build.tests.test_l23_naturalness -v

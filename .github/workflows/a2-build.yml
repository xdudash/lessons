name: Resume A2 semantic build

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: write

jobs:
  build-a2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout current SlovakGo runtime
        uses: actions/checkout@v4
        with:
          repository: xdudash/slovakGo
          ref: main
          path: _runtime/slovakGo
          persist-credentials: false
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Verify 18/90 checkpoint and builder tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files 'lessons/a2/*.json' | wc -l | tr -d ' ')" = 18
          grep -F 'IN PROGRESS — 18 / 90 active lessons' progress/A2_PROGRESS.md
          python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Configure commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Resume batches 04-15
        shell: bash
        run: |
          set -euo pipefail
          audit() {
            EXPECTED="$1" python3 - <<'PY'
          import json,os
          from pathlib import Path
          from tools.a2_build.semantic_profiles import PROFILES
          expected=int(os.environ['EXPECTED'])
          files=list(Path('lessons/a2').glob('a2-s*-l*.json'))
          assert len(files)==expected,(len(files),expected)
          banned=('Včera to zvládnem.','Ráno som.','To je aktívny.','Chcem budem','To je pôjdem.','To je prídem.','To je zavolám.','Chcem skúsenosť.','porom/neskôr','namiesto dnes','urobte prestup','potom tadiaľ cez','skôr lepšia rýchlejšia','Nabudúce môžeme sa','neschopný práce')
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))['lessons'][0]
              prof=PROFILES[d['order']]
              assert [x['examples'][0]['sk'] for x in d['theoryScreens']]==[x[0] for x in prof.models],(d['id'],'theory')
              steps=d['finalSituation']['steps']
              assert [x['prompt']['uk'] for x in steps]==list(prof.prompts_uk),(d['id'],'prompts')
              assert [next(o['sk'] for o in x['options'] if o.get('correct') is True) for x in steps]==[x[0] for x in prof.models],(d['id'],'answers')
              raw=json.dumps(d,ensure_ascii=False)
              for bad in banned: assert bad not in raw,(d['id'],bad)
          print(f'SEMANTIC AUDIT PASS: {expected}/90')
          PY
          }
          gate() {
            lo="$1"; hi="$2"; count="$3"; s1="$4"; s2="$5"
            echo "=== S${s1}-S${s2} / L${lo}-L${hi} ==="
            python3 -m tools.a2_build.build --root . --out lessons/a2 --from "$lo" --to "$hi" --manifest /tmp/a2-ownership.json
            python3 -m tools.a2_build.qa_a2 lessons/a2 --plan A2/LESSON_PLAN.md --from 1 --to "$hi"
            python3 -m tools.a2_build.schema_validate lessons/a2 _runtime/slovakGo/curriculum/lesson.schema.json --from 1 --to "$hi"
            node --experimental-strip-types _runtime/slovakGo/scripts/qa-lessons.ts lessons/a2
            audit "$count"
            if [ "$count" -lt 90 ]; then
              python3 -m tools.a2_build.progress --count "$count"
              git add lessons/a2 progress/A2_PROGRESS.md
            else
              git add lessons/a2
            fi
            git commit -m "[skip ci] content: rebuild A2 sections ${s1} to ${s2}"
            git push origin HEAD:a2-generator-debug
            git fetch origin a2-generator-debug
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-generator-debug)"
            n="$(git ls-tree -r --name-only origin/a2-generator-debug -- lessons/a2 | grep -E '^lessons/a2/a2-s[0-9]{2}-l[0-9]{2}\.json$' | wc -l | tr -d ' ')"
            test "$n" = "$count"
            echo "REMOTE BATCH VERIFIED: $n/90"
          }
          gate 19 36 36 04 06
          gate 37 54 54 07 09
          gate 55 72 72 10 12
          gate 73 90 90 13 15
      - name: Final 90/90 validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.a2_build.qa_a2 lessons/a2 --plan A2/LESSON_PLAN.md --from 1 --to 90
          python3 -m tools.a2_build.schema_validate lessons/a2 _runtime/slovakGo/curriculum/lesson.schema.json --from 1 --to 90
          node --experimental-strip-types _runtime/slovakGo/scripts/qa-lessons.ts lessons/a2
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.a2_build.semantic_profiles import PROFILES
          files=list(Path('lessons/a2').glob('a2-s*-l*.json')); assert len(files)==90
          docs={}
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))['lessons'][0]; docs[d['id']]=d
              prof=PROFILES[d['order']]
              assert [x['examples'][0]['sk'] for x in d['theoryScreens']]==[x[0] for x in prof.models]
              assert [x['prompt']['uk'] for x in d['finalSituation']['steps']]==list(prof.prompts_uk)
              assert [next(o['sk'] for o in x['options'] if o.get('correct') is True) for x in d['finalSituation']['steps']]==[x[0] for x in prof.models]
          expected=[f'a2-s{((n-1)//6)+1:02d}-l{n:02d}' for n in range(1,91)]
          assert sorted(docs,key=lambda x:int(x[-2:]))==expected
          for i,lid in enumerate(expected[:-1]):
              nxt=docs[lid]['resultScreen'].get('nextLesson'); got=nxt.get('id') if isinstance(nxt,dict) else nxt
              assert got==expected[i+1],(lid,got)
          assert 'nextLesson' not in docs[expected[-1]]['resultScreen']
          print('FINAL LOCAL PASS: 90/90, chain valid, L90 terminal, 270 semantic models exact')
          PY
      - name: Verify remote 90/90 and mark complete
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a2-generator-debug
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-generator-debug)"
          n="$(git ls-tree -r --name-only origin/a2-generator-debug -- lessons/a2 | grep -E '^lessons/a2/a2-s[0-9]{2}-l[0-9]{2}\.json$' | wc -l | tr -d ' ')"
          test "$n" = 90
          python3 -m tools.a2_build.progress --count 90 --complete
          git add progress/A2_PROGRESS.md
          git commit -m '[skip ci] A2 validated 90 of 90 on semantic build'
          git push origin HEAD:a2-generator-debug
          git fetch origin a2-generator-debug
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-generator-debug)"
          git show origin/a2-generator-debug:progress/A2_PROGRESS.md | grep -F 'COMPLETE — 90 / 90 active lessons'
          echo 'DEBUG PRODUCTION PASS: 90/90 COMPLETE'

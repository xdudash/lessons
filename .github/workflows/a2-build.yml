name: Test A2 generator semantics

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml
      - tools/a2_build/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full A2 build test suite
        run: python3 -m unittest discover -s tools/a2_build/tests -v

name: Export full A2 review corpus

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run generator regressions
        run: python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Generate all 90 review lessons
        run: python3 -m tools.a2_build.build --root . --out /tmp/a2-review --from 1 --to 90 --manifest /tmp/a2-ownership.json
      - uses: actions/upload-artifact@v4
        with:
          name: a2-full-review-corpus
          path: /tmp/a2-review

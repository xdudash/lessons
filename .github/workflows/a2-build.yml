name: Review generated A2 lessons

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run generator regressions
        run: python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Generate review corpus
        run: python3 -m tools.a2_build.build --root . --out /tmp/a2 --from 1 --to 90 --manifest /tmp/a2-ownership.json
      - name: Package representative lessons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a2-review
          cp /tmp/a2/a2-s01-l01.json /tmp/a2-review/
          cp /tmp/a2/a2-s03-l13.json /tmp/a2-review/
          cp /tmp/a2/a2-s04-l19.json /tmp/a2-review/
          cp /tmp/a2/a2-s06-l32.json /tmp/a2-review/
          cp /tmp/a2/a2-s07-l40.json /tmp/a2-review/
          cp /tmp/a2/a2-s11-l61.json /tmp/a2-review/
          cp /tmp/a2/a2-s13-l75.json /tmp/a2-review/
          cp /tmp/a2/a2-s14-l82.json /tmp/a2-review/
          cp /tmp/a2/a2-s15-l90.json /tmp/a2-review/
      - uses: actions/upload-artifact@v4
        with:
          name: a2-review-corpus
          path: /tmp/a2-review

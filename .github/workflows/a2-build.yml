name: Scan A2 generated examples

on:
  push:
    branches: [a2-generator-debug]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-generator-debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Re-run generator regressions
        run: python3 -m unittest discover -s tools/a2_build/tests -v
      - name: Generate all 90 lessons for diagnostics
        run: python3 -m tools.a2_build.build --root . --out /tmp/a2 --from 1 --to 90 --manifest /tmp/a2-ownership.json
      - name: Scan every generated target example
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          finite_markers={
              'som','sme','ste','je','sú','mám','máme','má','majú','musím','musíme','môžem','môžeme',
              'chcem','chceme','budem','budeme','budeš','budete','bude','budú','pôjdem','pôjdeme',
              'prídem','prídeme','zavolám','zavoláme','napíšem','napíšeme','idem','ideme','chodím',
              'chodíme','robím','robíme','pracujem','pracujeme','stretli','išli','boli','prišiel','išiel',
          }
          hard=[]; raw=[]; generic=[]; short_aux=[]
          rows=[]
          for path in sorted(Path('/tmp/a2').glob('a2-s*-l*.json')):
              lesson=json.loads(path.read_text(encoding='utf-8'))['lessons'][0]
              for w in lesson['words']:
                  target=w['sk'].strip()
                  ex=w['exampleSk'].strip()
                  row={'lessonId':lesson['id'],'target':target,'exampleSk':ex,'exampleUk':w['exampleUk']}
                  rows.append(row)
                  low=ex.lower()
                  if re.search(r'\bchcem\s+(budem|budeme|budeš|budete|bude|budú)\b', low):
                      hard.append(('chcem+future',row))
                  if re.search(r'\bchcem\s+sa\s+.*\b(som|sme|ste)\b', low):
                      hard.append(('chcem-sa+finite',row))
                  if re.match(r'^to je\s+(pôjdem|prídem|zavolám|napíšem|budem|urobím|idem|môžem|musím|chcem)\b', low):
                      hard.append(('to-je+finite',row))
                  if low.startswith('chcem ') and target.lower().endswith('osť'):
                      hard.append(('ost-as-infinitive',row))
                  if ' to zvládnem.' in low:
                      generic.append(row)
                  normalized_target=target.lower().rstrip('.!?').strip()
                  normalized_ex=ex.lower().rstrip('.!?').strip()
                  tokens=re.findall(r"[\wÀ-ž’'-]+", normalized_target, flags=re.UNICODE)
                  if len(tokens)>=2 and normalized_ex==normalized_target:
                      has_finite=any(t in finite_markers for t in tokens)
                      uk=w['uk'].lower().strip()
                      pronoun_meaning=uk.startswith(('я ','ми ','він ','вона ','вони '))
                      question=target.endswith('?')
                      if not (has_finite or pronoun_meaning or question):
                          raw.append(row)
                  ex_tokens=re.findall(r"[\wÀ-ž’'-]+", low, flags=re.UNICODE)
                  if ex_tokens and ex_tokens[-1] in {'som','sme','ste','budem','budeme','budeš','budete','bude','budú'}:
                      short_aux.append(row)
          report={'hard':hard,'raw_echo_nonfinite':raw,'generic_to_zvladnem':generic,'auxiliary_fragments':short_aux,'all':rows}
          Path('/tmp/a2-example-scan.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"EXAMPLE SCAN: total={len(rows)} hard={len(hard)} raw_echo_nonfinite={len(raw)} generic_to_zvladnem={len(generic)} auxiliary_fragments={len(short_aux)}")
          for label, items in [('HARD',hard),('RAW',[(None,x) for x in raw]),('GENERIC',[(None,x) for x in generic]),('AUX',[(None,x) for x in short_aux])]:
              if not items: continue
              print(f'--- {label} ---')
              for reason,row in items[:120]:
                  prefix=f'{reason}: ' if reason else ''
                  print(f"{prefix}{row['lessonId']} | {row['target']} => {row['exampleSk']} | {row['exampleUk']}")
          # This diagnostic gate is intentionally strict: any raw non-finite target used as a whole
          # example or generic catch-all sentence requires review before production regeneration.
          if hard or raw or generic or short_aux:
              sys.exit(1)
          PY
      - name: Upload complete example scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-example-scan
          path: /tmp/a2-example-scan.json

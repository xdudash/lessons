name: Build A2 course

on:
  push:
    branches: [a2-inline]
    paths:
      - .github/workflows/a2-build.yml

permissions:
  contents: write

jobs:
  build-a2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated A2 branch
        uses: actions/checkout@v4
        with:
          ref: a2-inline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout current SlovakGo runtime contracts
        uses: actions/checkout@v4
        with:
          repository: xdudash/slovakGo
          ref: main
          path: _runtime/slovakGo
          persist-credentials: false

      - name: Reassemble and verify A2 build harness
        shell: bash
        run: |
          set -euo pipefail
          cat tools/a2_bundle/chunk{00..13} > /tmp/a2-harness.b64
          echo 'ce75d90f23ab764469974edebb4c3635ee97ae161b4522c329740adf64bdebbd  /tmp/a2-harness.b64' | sha256sum -c -
          base64 -d /tmp/a2-harness.b64 > /tmp/a2-harness.tgz
          echo '0360d31e07ecb7723098d72509d9f3de7a2bae0a97c454d4411849e8c59db670  /tmp/a2-harness.tgz' | sha256sum -c -
          tar -xzf /tmp/a2-harness.tgz
          find tools/a2_build -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m pip install --disable-pip-version-check jsonschema

      - name: Run full harness tests against real repository
        env:
          SLOVAKGO_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/a2_build/tests -v

      - name: Configure isolated branch commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Build and publish five green A2 batches
        shell: bash
        run: |
          set -euo pipefail

          gate() {
            local lo="$1" hi="$2" count="$3" first_section="$4" last_section="$5"
            echo "=== A2 batch S${first_section}-S${last_section}: L${lo}-L${hi} ==="
            python3 -m tools.a2_build.build --root . --out lessons/a2 --from "$lo" --to "$hi" --manifest /tmp/a2-ownership.json
            python3 -m tools.a2_build.qa_a2 lessons/a2 --plan A2/LESSON_PLAN.md --from 1 --to "$hi"
            python3 -m tools.a2_build.schema_validate lessons/a2 _runtime/slovakGo/curriculum/lesson.schema.json --from 1 --to "$hi"
            node --experimental-strip-types _runtime/slovakGo/scripts/qa-lessons.ts lessons/a2

            if [ "$count" -lt 90 ]; then
              python3 -m tools.a2_build.progress --count "$count"
              git add lessons/a2 progress/A2_PROGRESS.md
            else
              git add lessons/a2
            fi
            git commit -m "[skip ci] content: add A2 sections ${first_section} to ${last_section}"
            git push origin HEAD:a2-inline
            git fetch origin a2-inline
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-inline)"
            local remote_count
            remote_count="$(git ls-tree -r --name-only origin/a2-inline -- lessons/a2 | grep -E '^lessons/a2/a2-s[0-9]{2}-l[0-9]{2}\.json$' | wc -l | tr -d ' ')"
            test "$remote_count" = "$count"
            echo "REMOTE BATCH VERIFIED: ${remote_count}/90 files at $(git rev-parse --short HEAD)"
          }

          gate 1 18 18 01 03
          gate 19 36 36 04 06
          gate 37 54 54 07 09
          gate 55 72 72 10 12
          gate 73 90 90 13 15

      - name: Run final all-90 validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.a2_build.qa_a2 lessons/a2 --plan A2/LESSON_PLAN.md --from 1 --to 90
          python3 -m tools.a2_build.schema_validate lessons/a2 _runtime/slovakGo/curriculum/lesson.schema.json --from 1 --to 90
          node --experimental-strip-types _runtime/slovakGo/scripts/qa-lessons.ts lessons/a2
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('lessons/a2').glob('a2-s*-l*.json'))
          assert len(files)==90, len(files)
          ids=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))['lessons'][0]
              ids.append(d['id'])
              assert d['level']=='A2'
              assert d['order']==int(d['id'][-2:])
          expected=[f'a2-s{((n-1)//6)+1:02d}-l{n:02d}' for n in range(1,91)]
          by_order=sorted(ids,key=lambda x:int(x[-2:]))
          assert by_order==expected
          for n,lid in enumerate(expected[:-1],1):
              p=Path('lessons/a2')/f'{lid}.json'
              d=json.loads(p.read_text(encoding='utf-8'))['lessons'][0]
              nxt=d['resultScreen'].get('nextLesson')
              got=nxt.get('id') if isinstance(nxt,dict) else nxt
              assert got==expected[n], (lid,got,expected[n])
          last=json.loads((Path('lessons/a2')/'a2-s15-l90.json').read_text(encoding='utf-8'))['lessons'][0]
          assert 'nextLesson' not in last['resultScreen']
          print('FINAL INVENTORY/CHAIN PASS: 90/90, L90 terminal')
          PY

      - name: Verify remote 90/90 before declaring completion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a2-inline
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-inline)"
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','ls-tree','-r','--name-only','origin/a2-inline','--','lessons/a2'],text=True).splitlines()
          names=[x for x in names if x.endswith('.json')]
          expected=[f'lessons/a2/a2-s{((n-1)//6)+1:02d}-l{n:02d}.json' for n in range(1,91)]
          assert sorted(names)==sorted(expected), (len(names), set(expected)-set(names), set(names)-set(expected))
          print('REMOTE INVENTORY PASS: exact 90 A2 lesson paths')
          PY

      - name: Mark A2 complete and clean temporary production tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.a2_build.progress --count 90 --complete
          rm -rf tools/a2_build tools/a2_bundle _runtime
          rm -f tools/__init__.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -f .github/workflows/a2-build.yml
          git add -A
          git commit -m '[skip ci] Complete A2 level with 90 active lessons'
          git push origin HEAD:a2-inline

      - name: Verify final remote branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a2-inline
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/a2-inline)"
          python3 - <<'PY'
          import subprocess
          tree=subprocess.check_output(['git','ls-tree','-r','--name-only','origin/a2-inline'],text=True).splitlines()
          a2=[x for x in tree if x.startswith('lessons/a2/') and x.endswith('.json')]
          expected=[f'lessons/a2/a2-s{((n-1)//6)+1:02d}-l{n:02d}.json' for n in range(1,91)]
          assert sorted(a2)==sorted(expected)
          assert 'tools/a2_build' not in '\n'.join(tree)
          assert 'tools/a2_bundle' not in '\n'.join(tree)
          assert '.github/workflows/a2-build.yml' not in tree
          progress=subprocess.check_output(['git','show','origin/a2-inline:progress/A2_PROGRESS.md'],text=True)
          assert 'COMPLETE — 90 / 90 active lessons' in progress
          print('FINAL REMOTE PASS: 90/90, progress COMPLETE, temporary builder removed')
          PY

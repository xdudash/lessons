name: Generate canonical A1 lessons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-a1:
    if: "!contains(github.event.head_commit.message, '[a1-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate A1
        run: python tools/build_all_a1.py
      - name: Commit generated lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/a1
          git add curriculum/A1_MASTER_LESSON_PLAN.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Generate canonical A1 lessons [a1-generated]"
          git push

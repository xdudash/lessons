name: Build A1 tail once

on:
  push:
    paths:
      - '.github/workflows/build-a1-tail.yml'

permissions:
  contents: write

jobs:
  build-a1-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/a1_tail_build/chunk00_00 \
            tools/a1_tail_build/chunk00_01 \
            tools/a1_tail_build/chunk00_02 \
            tools/a1_tail_build/chunk01 \
            tools/a1_tail_build/chunk02 \
            tools/a1_tail_build/chunk03 \
            tools/a1_tail_build/chunk04 \
            tools/a1_tail_build/chunk05 \
            tools/a1_tail_build/chunk06 \
            tools/a1_tail_build/chunk07_00 \
            tools/a1_tail_build/chunk07_01 \
            tools/a1_tail_build/chunk07_02_00 \
            tools/a1_tail_build/chunk07_02_01 \
            tools/a1_tail_build/chunk08 > /tmp/a1bundle.b64
          base64 -d /tmp/a1bundle.b64 > /tmp/a1bundle.tgz
          echo 'beafbfe5264f9ab9e6082c2f99bfd2669d8fc799f0da302a3a042f2c7dd7c123  /tmp/a1bundle.tgz' | sha256sum -c -
          rm -rf /tmp/a1bundle /tmp/slovakgo-build
          tar -xzf /tmp/a1bundle.tgz -C /tmp
          mkdir -p /tmp/slovakgo-build/lessons/a1
          cp /tmp/a1bundle/*.py /tmp/slovakgo-build/

      - name: Apply reviewed final-intent fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('/tmp/slovakgo-build/specs_07_10.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "['Ти просиш меню.','Ти називаєш гарнір.','Ти питаєш ціну.']":"['Ти просиш меню.','Ти називаєш гарнір.','Ти називаєш напій.']",
            "['Ти просиш рахунок.','Ти кажеш, що платиш карткою.','Ти відповідаєш на «ще щось?».']":"['Ти просиш рахунок.','Ти кажеш, що платиш карткою.','Ти кажеш, що платите окремо.']",
            "['Ти кажеш, що шукаєш футболку.','Ти питаєш, чи є товар.','Ти кажеш, що хочеш купити.']":"['Ти кажеш, що шукаєш футболку.','Ти питаєш, чи є синій варіант.','Ти питаєш, чи можна приміряти.']",
            "['Ти питаєш ціну.','Ти називаєш ціну в євро.','Ти кажеш, що є знижка.']":"['Ти питаєш ціну.','Ти кажеш, що ціна хороша.','Ти кажеш, що є знижка.']",
            "['Ти повідомляєш про проблему.','Ти хочеш обміняти товар.','Ти просиш повторити.']":"['Ти повідомляєш про проблему.','Ти хочеш обміняти товар.','Ти ввічливо кажеш, що не розумієш.']",
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('/tmp/slovakgo-build/specs_11_14.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "['Ти кажеш, що вивчаєш словацьку.','Ти кажеш, що ти в школі.','Ти просиш повторити.']":"['Ти кажеш, що вивчаєш словацьку.','Ти кажеш, що ти в школі.','Ти кажеш, що маєш питання.']",
            "['Ти кажеш, коли починаєш.','Ти називаєш обов’язок.','Ти кажеш «до четвертої».']":"['Ти кажеш, коли починаєш.','Ти називаєш обов’язок.','Ти кажеш «працюю від восьмої».']",
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cd /tmp/slovakgo-build
          echo 'dd1f6d2c97cbf4f629eacee17cf495e1f3663875b408abee313b13b1402ac583  generator.py' | sha256sum -c -
          echo 'c07a211e18682c70106e788553f372e5d190cd97b0784324b9fd8a9d2faacc00  specs_07_10.py' | sha256sum -c -
          echo '96055242ca717a898ca1259c14df1ad671d4894472d4a2c4b469e4975e6df920  specs_11_14.py' | sha256sum -c -
          echo '2c075abbd35adc5050636a47076ce20dffb2746000f276f3a6c814b465eafc1d  qa_local.py' | sha256sum -c -

      - name: Generate and QA L38-L81
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/slovakgo-build
          python3 specs_07_10.py
          python3 specs_11_14.py
          python3 qa_local.py lessons/a1
          test "$(find lessons/a1 -maxdepth 1 -name 'a1-s*-l*.json' | wc -l)" -eq 44
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
            54: [('Ти просиш меню.','Prosím si jedálny lístok.'),('Ти називаєш гарнір.','Príloha je ryža.'),('Ти називаєш напій.','Nápoj je voda alebo džús.')],
            56: [('Ти просиш рахунок.','Účet, prosím.'),('Ти кажеш, що платиш карткою.','Zaplatím kartou.'),('Ти кажеш, що платите окремо.','Platíme samostatne.')],
            57: [('Ти кажеш, що шукаєш футболку.','Hľadám tričko.'),('Ти питаєш, чи є синій варіант.','Nemáte modrú?'),('Ти питаєш, чи можна приміряти.','Môžem si to skúsiť?')],
            58: [('Ти питаєш ціну.','Koľko to stojí?'),('Ти кажеш, що ціна хороша.','Cena je dobrá.'),('Ти кажеш, що є знижка.','Je tu zľava.')],
            62: [('Ти повідомляєш про проблему.','Mám problém.'),('Ти хочеш обміняти товар.','Chcem to vymeniť.'),('Ти ввічливо кажеш, що не розумієш.','Prepáčte, nerozumiem.')],
            63: [('Ти кажеш, що вивчаєш словацьку.','Študujem slovenčinu.'),('Ти кажеш, що ти в школі.','Som v škole.'),('Ти кажеш, що маєш питання.','Mám otázku.')],
            66: [('Ти кажеш, коли починаєш.','Začínam o ôsmej.'),('Ти називаєш обов’язок.','Toto je moja povinnosť.'),('Ти кажеш «працюю від восьмої».','Pracujem od ôsmej.')],
          }
          for n,pairs in expected.items():
              f=next(Path('lessons/a1').glob(f'a1-s*-l{n}.json'))
              lesson=json.loads(f.read_text(encoding='utf-8'))['lessons'][0]
              got=[]
              for step in lesson['finalSituation']['steps']:
                  correct=next(o['sk'] for o in step['options'] if o.get('correct'))
                  got.append((step['prompt']['uk'],correct))
              assert got == pairs, (n,got,pairs)
          print('Final intent QA PASS:',len(expected),'lessons')
          PY

      - name: Install final S09-S14 lessons
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 51 81); do
            src=$(find /tmp/slovakgo-build/lessons/a1 -maxdepth 1 -name "a1-s*-l${n}.json" -print -quit)
            test -n "$src"
            cp "$src" lessons/a1/
          done

      - name: Verify complete A1 inventory and chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('lessons/a1')
          sections={1:range(1,7),2:range(7,12),3:range(18,23),4:range(23,27),5:range(27,31),6:range(31,38),7:range(38,44),8:range(44,51),9:range(51,57),10:range(57,63),11:range(63,68),12:range(68,73),13:range(73,77),14:range(77,82)}
          expected=[f'a1-s{sec:02d}-l{order:02d}' for sec,orders in sections.items() for order in orders]
          assert len(expected)==75
          lessons={}
          actual=[]
          for f in sorted(root.glob('a1-s*-l*.json')):
              lesson=json.loads(f.read_text(encoding='utf-8'))['lessons'][0]
              actual.append(lesson['id']); lessons[lesson['id']]=lesson
          assert sorted(actual)==sorted(expected),(len(actual),sorted(set(expected)-set(actual)),sorted(set(actual)-set(expected)))
          for retired in range(12,18):
              assert not list(root.glob(f'a1-s*-l{retired:02d}.json')),retired
          for i,lid in enumerate(expected[:-1]):
              nxt=lessons[lid].get('resultScreen',{}).get('nextLesson')
              nxt_id=nxt.get('id') if isinstance(nxt,dict) else nxt
              assert nxt_id==expected[i+1],(lid,nxt_id,expected[i+1])
          assert lessons[expected[-1]].get('resultScreen',{}).get('nextLesson') in (None,''),lessons[expected[-1]].get('resultScreen',{}).get('nextLesson')
          print('A1 inventory + chain PASS: 75 active lessons; retired l12-l17 absent.')
          PY

      - name: Update A1 progress
        shell: bash
        run: |
          cat > progress/A1_PROGRESS.md <<'EOF'
          # SlovakGo A1 — Progress

          ## Status
          **COMPLETE — 75 / 75 active lessons**

          A1 follows `curriculum/A1_MASTER_LESSON_PLAN.md`. Retired IDs `l12–l17` are intentionally absent and are not part of the 75 active lessons.

          ## Sections
          - S01 `l01–l06` — complete
          - S02 `l07–l11` — complete
          - S03 `l18–l22` — complete
          - S04 `l23–l26` — complete
          - S05 `l27–l30` — complete
          - S06 `l31–l37` — complete
          - S07 `l38–l43` — complete
          - S08 `l44–l50` — complete
          - S09 `l51–l56` — complete
          - S10 `l57–l62` — complete
          - S11 `l63–l67` — complete
          - S12 `l68–l72` — complete
          - S13 `l73–l76` — complete
          - S14 `l77–l81` — complete

          ## Completion checks
          - 75 active A1 lesson IDs present.
          - Retired `l12–l17` absent.
          - `nextLesson` chain validated from `l01` through `l81` across the retired gap.
          - Tail `l38–l81` regenerated from reviewed specs and passed runtime-shape/adversarial QA before publication.
          - Final-situation prompt/answer intent checks passed for the reviewed mismatch cases.
          - Lesson UI language is Ukrainian; target language is Slovak.
          - Lessons remain `isPublished: false` pending product publication controls.

          ## A1 → A2 boundary
          A1 is content-complete. Further changes to A1 should be QA/errata improvements, not expansion of the active lesson count, unless the master plan is deliberately revised.
          EOF
          sed -i 's/^          //' progress/A1_PROGRESS.md

      - name: Commit final lessons and remove one-shot builder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/a1_tail_build
          rm -f .github/workflows/build-a1-tail.yml
          git config user.name 'slovakgo-course-bot'
          git config user.email 'slovakgo-course-bot@users.noreply.github.com'
          git add lessons/a1 progress/A1_PROGRESS.md tools/a1_tail_build .github/workflows/build-a1-tail.yml
          git commit -m '[skip ci] Complete A1 level with 75 active lessons'
          git push origin HEAD:main

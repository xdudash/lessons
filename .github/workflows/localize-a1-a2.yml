name: Localize and verify A1 A2

on:
  push:
    branches: [localize-a1-a2]
    paths:
      - .github/workflows/localize-a1-a2.yml
      - tools/localize_a1_a2.py
      - lessons/a1/**
      - lessons/a2/**

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize-a1-a2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install localization and QA dependencies
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers<5' sentencepiece sacremoses jsonschema
      - name: Build Russian and English lesson localization
        run: python tools/localize_a1_a2.py
      - name: Require complete Ukrainian Russian English maps
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          LANGS={'uk','ru','en'}; errors=[]; count=0
          def check_map(value, where):
              if not isinstance(value, dict): errors.append(f'{where}: expected localized object'); return
              missing=LANGS-set(value)
              if missing: errors.append(f'{where}: missing {sorted(missing)}')
              for lang in LANGS:
                  if lang in value and not str(value[lang]).strip(): errors.append(f'{where}: empty {lang}')
          for level in ('a1','a2'):
              for p in sorted(Path('lessons',level).glob(f'{level}-s*-l*.json')):
                  count+=1; lesson=json.loads(p.read_text(encoding='utf-8'))['lessons'][0]
                  loc=lesson.get('localization',{})
                  if set(loc.get('uiLanguages',[])) != LANGS: errors.append(f'{p.name}: uiLanguages={loc.get("uiLanguages")}')
                  for key in ('title','topic','description','intro','completionMessage'): check_map(lesson.get(key),f'{p.name}:{key}')
                  ss=lesson.get('startScreen',{})
                  for key in ('title','shortDescription','subtitle','goal','eyebrow'):
                      if key in ss: check_map(ss[key],f'{p.name}:startScreen.{key}')
                  for i,v in enumerate(ss.get('outcomes',[]) or [],1): check_map(v,f'{p.name}:startScreen.outcomes[{i}]')
                  if 'button' in ss: errors.append(f'{p.name}: startScreen.button must use app i18n fallback')
                  for i,t in enumerate(lesson.get('theoryScreens',[]),1):
                      for key in ('title','body','text','shortRule'):
                          if key in t: check_map(t[key],f'{p.name}:theory[{i}].{key}')
                      if 'button' in t: errors.append(f'{p.name}:theory[{i}].button must use app i18n fallback')
                      for j,ex in enumerate(t.get('examples',[]),1):
                          if 'translation' in ex: check_map(ex['translation'],f'{p.name}:theory[{i}].examples[{j}].translation')
                          if 'uk' in ex: errors.append(f'{p.name}:theory[{i}].examples[{j}] legacy uk shadows multilingual translation')
                  ws=lesson.get('wordsScreen',{})
                  for key in ('title','description','subtitle'):
                      if key in ws: check_map(ws[key],f'{p.name}:wordsScreen.{key}')
                  if 'items' in ws: errors.append(f'{p.name}: legacy wordsScreen.items shadows multilingual words')
                  if 'button' in ws: errors.append(f'{p.name}: wordsScreen.button must use app i18n fallback')
                  for i,w in enumerate(lesson.get('words',[]),1):
                      check_map(w.get('translation'),f'{p.name}:words[{i}].translation')
                      ex=w.get('example')
                      if not isinstance(ex,dict) or not ex.get('sk'): errors.append(f'{p.name}:words[{i}].example missing multilingual format')
                      else: check_map(ex.get('translation'),f'{p.name}:words[{i}].example.translation')
                  for i,e in enumerate(lesson.get('exercises',[]),1):
                      for key in ('instruction','question','prompt','explanation','hint','text','statement','sentence','displaySentence','context','target','situation','phrase','source','successMessage'):
                          if key in e and isinstance(e[key],(str,dict)) and (isinstance(e[key],dict) or any(c in str(e[key]) for c in 'АБВГДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯабвгдеєжзиіїйклмнопрстуфхцчшщьюя')):
                              check_map(e[key],f'{p.name}:exercise[{i}].{key}')
                      if 'button' in e: errors.append(f'{p.name}:exercise[{i}].button must use app i18n fallback')
                      for j,o in enumerate(e.get('options',[]) if isinstance(e.get('options'),list) else [],1):
                          if isinstance(o,dict) and 'text' in o: check_map(o['text'],f'{p.name}:exercise[{i}].options[{j}].text')
                      for j,s in enumerate(e.get('statements',[]) if isinstance(e.get('statements'),list) else [],1):
                          if isinstance(s,dict) and any(c in str(s.get('sk','')) for c in 'АБВГДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯабвгдеєжзиіїйклмнопрстуфхцчшщьюя'):
                              check_map(s.get('text'),f'{p.name}:exercise[{i}].statements[{j}].text')
                  fs=lesson.get('finalSituation',{})
                  if fs.get('type')=='interactive_scenario':
                      for key in ('title','description','successMessage'):
                          if key in fs: check_map(fs[key],f'{p.name}:final.{key}')
                      for i,step in enumerate(fs.get('steps',[]),1): check_map(step.get('prompt'),f'{p.name}:final.steps[{i}].prompt')
                  rs=lesson.get('resultScreen',{})
                  for key in ('title','text','subtitle'):
                      if key in rs: check_map(rs[key],f'{p.name}:result.{key}')
                  for i,s in enumerate(rs.get('skills',[]) if isinstance(rs.get('skills'),list) else [],1):
                      if isinstance(s,dict) and 'label' in s: check_map(s['label'],f'{p.name}:result.skills[{i}].label')
          print(f'MULTILINGUAL CHECK: lessons={count} errors={len(errors)}')
          for e in errors[:100]: print(e)
          if errors: raise SystemExit(1)
          assert count == 165, count
          PY
      - uses: actions/checkout@v4
        with:
          repository: xdudash/slovakGo
          path: slovakgo
      - name: Validate all lessons against current app schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('slovakgo/curriculum/lesson.schema.json').read_text(encoding='utf-8'))
          v=Draft202012Validator(schema); errors=[]; count=0
          for level in ('a1','a2'):
              for p in sorted(Path('lessons',level).glob(f'{level}-s*-l*.json')):
                  count+=1
                  doc=json.loads(p.read_text(encoding='utf-8'))
                  for e in v.iter_errors(doc): errors.append(f'{p.name}: {e.message}')
          print(f'SCHEMA CHECK: lessons={count} errors={len(errors)}')
          for e in errors[:100]: print(e)
          if errors: raise SystemExit(1)
          PY
      - name: Validate current app runtime contract
        run: |
          node --experimental-strip-types slovakgo/scripts/qa-lessons.ts lessons/a1
          node --experimental-strip-types slovakgo/scripts/qa-lessons.ts lessons/a2
      - name: Verify inventories and terminal chains
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          for level,expected in [('a1',75),('a2',90)]:
              files=sorted(Path('lessons',level).glob(f'{level}-s*-l*.json'),key=lambda p:int(re.search(r'-l(\d+)\.json$',p.name).group(1)))
              assert len(files)==expected,(level,len(files))
              lessons=[json.loads(p.read_text(encoding='utf-8'))['lessons'][0] for p in files]
              assert len({x['id'] for x in lessons})==expected
              for a,b in zip(lessons,lessons[1:]):
                  nxt=a.get('resultScreen',{}).get('nextLesson')
                  got=nxt.get('id') if isinstance(nxt,dict) else nxt
                  assert got==b['id'],(a['id'],got,b['id'])
              assert 'nextLesson' not in lessons[-1].get('resultScreen',{}), lessons[-1]['id']
              print(level, expected, 'inventory and chain OK')
          PY
      - name: Commit localized lesson content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/a1 lessons/a2
          if git diff --cached --quiet; then
            echo "No lesson changes to commit"
          else
            git commit -m "feat: localize A1 and A2 lessons to Ukrainian Russian English"
            git push origin HEAD:localize-a1-a2
          fi

name: Test A1 A2 localizer

on:
  push:
    branches: [localize-a1-a2]
    paths:
      - tools/test_localize_a1_a2.py
      - tools/localize_a1_a2.py
      - .github/workflows/test-localize-a1-a2.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localize-a1-a2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/test_localize_a1_a2.py

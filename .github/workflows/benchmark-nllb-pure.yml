name: Benchmark pure NLLB
on:
  push:
    branches: [localize-a2-production]
    paths:
      - tools/benchmark_nllb_pure.py
      - .github/workflows/benchmark-nllb-pure.yml
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers<5' sentencepiece
      - run: python tools/benchmark_nllb_pure.py
